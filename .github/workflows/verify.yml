name: Verify Application

# Thin verification entrypoint. Runner setup, dependency checkouts, toolchain
# versions, and the install command come from the reusable SDKWork CI workflow
# and `agent.workflow.json`; this file only selects the triggers and the gate
# scripts. Never add inline setup, install, or gate commands here — declare them
# in `agent.workflow.json` or the repository's package scripts instead.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-ci.yml@b0829529b9277a3da32b90c2d36ff34ff09fa832
    with:
      config_path: agent.workflow.json
      scripts: verify
      install_command: pnpm install --frozen-lockfile
      os_matrix: '["ubuntu-24.04"]'
      framework_ref: b0829529b9277a3da32b90c2d36ff34ff09fa832
    secrets:
      SDKWORK_RELEASE_TOKEN: ${{ secrets.SDKWORK_RELEASE_TOKEN }}
