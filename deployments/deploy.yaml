version: 2
defaultProfile: cloud.production
profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: canvas-test.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
      - domain: canvas-test.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
      - domain: canvas-test.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
      - domain: canvas-test.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
      - domain: canvas-test.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
      - domain: canvas-test.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
      kubernetes:
        reference: deployments/kubernetes/
  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: canvas-staging.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
      - domain: canvas-staging.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
      - domain: canvas-staging.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
      - domain: canvas-staging.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
      - domain: canvas-staging.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
      - domain: canvas-staging.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.staging
        env: etc/topology/cloud.staging.env
      kubernetes:
        reference: deployments/kubernetes/
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: canvas.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
      - domain: canvas.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
      - domain: canvas.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
      - domain: canvas.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
      - domain: canvas.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
      - domain: canvas.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - domain: canvas.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
      - domain: canvas.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
      - domain: canvas.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
      - domain: canvas.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
      - domain: canvas.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
      - domain: canvas.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: pc
        apiPathStyle: full-prefix
    packages:
      - desktop-windows
      - desktop-macos
      - desktop-linux
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:8787
          platform.api-gateway: http://127.0.0.1:3900
      nginx:
        clientMaxBodySize: 32m
