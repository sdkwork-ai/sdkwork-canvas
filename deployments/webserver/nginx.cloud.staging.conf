# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/canvas/webserver.pid;
error_log /var/log/sdkwork/canvas/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name canvas-staging.sdkwork.com canvas-staging.birdcoder.com canvas-staging.dtupay.com canvas-staging.sdkwork.cn canvas-staging.birdcoder.cn canvas-staging.dtupay.cn canvas-staging.skubc.com canvas-staging.skubc.cn canvas-staging.zowalk.com canvas-staging.zowalk.cn canvas-staging.offer86.com canvas-staging.offer86.cn canvas-staging.86offer.com canvas-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
