# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/canvas/webserver.pid;
error_log /var/log/sdkwork/canvas/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name canvas-demo.sdkwork.com canvas-demo.birdcoder.com canvas-demo.dtupay.com canvas-demo.noaper.com canvas-demo.sdkwork.cn canvas-demo.birdcoder.cn canvas-demo.dtupay.cn canvas-demo.noaper.cn canvas-demo.skubc.com canvas-demo.skubc.cn canvas-demo.zowalk.com canvas-demo.zowalk.cn canvas-demo.offer86.com canvas-demo.offer86.cn canvas-demo.86offer.com canvas-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/canvas/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
