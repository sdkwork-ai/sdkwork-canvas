# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/canvas/webserver.pid;
error_log /var/log/sdkwork/canvas/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name canvas-dev.sdkwork.com canvas-dev.birdcoder.com canvas-dev.dtupay.com canvas-dev.sdkwork.cn canvas-dev.birdcoder.cn canvas-dev.dtupay.cn canvas-dev.skubc.com canvas-dev.skubc.cn canvas-dev.zowalk.com canvas-dev.zowalk.cn canvas-dev.offer86.com canvas-dev.offer86.cn canvas-dev.86offer.com canvas-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
